# Debug overlay: west build ... -- -DEXTRA_CONF_FILE=debug.conf
# Logs over SEGGER RTT via the SWD (Tag-Connect) header.
# Upstream Zephyr: `west config manifest.project-filter -- +segger` and
# `west update` first. nRF Connect SDK includes it already.
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_ASSERT=y
