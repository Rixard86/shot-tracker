# ---- core
CONFIG_FPU=y
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_POWEROFF=y

# ---- storage (lifetime count, thresholds)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ---- Bluetooth LE peripheral
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ShotPuck"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_BAS=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=80
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=160
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_DEVICE_NAME_DYNAMIC=y

# ---- pairing: LE Secure Connections, new bonds only while the charger is attached
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# ---- identity: Device Information Service with the chip's unique ID
CONFIG_HWINFO=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_SETTINGS=y
CONFIG_BT_DIS_SERIAL_NUMBER=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="ShotPuck"
CONFIG_BT_DIS_MANUF_NAME=n
CONFIG_BT_DIS_PNP=n
CONFIG_BT_DIS_FW_REV=y

# ---- OTA: MCUboot (sysbuild) + MCUmgr SMP over BLE, paired phones only
CONFIG_MCUMGR=y
CONFIG_ZCBOR=y
CONFIG_NET_BUF=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_ENCRYPT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y

# ---- watchdog: a hung image resets, and MCUboot reverts an unconfirmed one
CONFIG_WATCHDOG=y

# ---- low power release build: no UART, no logging
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
